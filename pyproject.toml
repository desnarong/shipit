[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shipit"
version = "0.1.0"
description = "Self-hosted, language-agnostic auto deploy: git push -> build -> health check -> rollback"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = []

[project.scripts]
shipit = "shipit.cli:main"

[tool.setuptools]
packages = ["shipit"]
