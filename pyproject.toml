[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shipit-deploy"
version = "0.1.0"
description = "Self-hosted, language-agnostic auto deploy: git push -> build -> health check -> rollback"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = []
keywords = ["deploy", "auto-deploy", "docker", "ci-cd", "self-hosted", "webhook", "devops"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Build Tools",
    "Topic :: System :: Software Distribution",
]

[project.urls]
Homepage = "https://github.com/desnarong/shipit"
Issues = "https://github.com/desnarong/shipit/issues"
Changelog = "https://github.com/desnarong/shipit/blob/main/CHANGELOG.md"

[project.scripts]
shipit = "shipit.cli:main"

[tool.setuptools]
packages = ["shipit"]
